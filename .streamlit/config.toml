# Theme "Apple" applique nativement par Streamlit : les widgets internes
# (sliders, radios, liens, spinners) reprennent ces couleurs, ce que le CSS
# personnalise de app.py ne peut pas faire proprement.
[theme]
base = "light"
primaryColor = "#0071e3"
backgroundColor = "#f5f5f7"
secondaryBackgroundColor = "#ffffff"
textColor = "#1d1d1f"
font = "sans serif"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
headless = true
